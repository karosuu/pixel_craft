name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Build admin CRM
        working-directory: admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          URL="${VITE_SUPABASE_URL:-$PUBLIC_SUPABASE_URL}"
          KEY="${VITE_SUPABASE_ANON_KEY:-$PUBLIC_SUPABASE_ANON_KEY}"
          URL="${URL%$'\r'}"
          KEY="${KEY%$'\r'}"
          URL="${URL%\"}"
          URL="${URL#\"}"
          KEY="${KEY%\"}"
          KEY="${KEY#\"}"
          if [[ ! "$URL" =~ ^https:// ]] || [[ -z "$KEY" ]]; then
            echo "Missing or invalid Supabase secrets (need VITE_SUPABASE_* or PUBLIC_SUPABASE_*)" >&2
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env.production
          npm run build
      - name: Copy admin into site
        run: node scripts/copy-admin.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
