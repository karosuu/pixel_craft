name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Supabase env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          URL="${PUBLIC_SUPABASE_URL:-$VITE_SUPABASE_URL}"
          KEY="${PUBLIC_SUPABASE_ANON_KEY:-$VITE_SUPABASE_ANON_KEY}"
          URL="$(printf '%s' "$URL" | tr -d '\r\n' | sed 's/^["[:space:]]*//;s/["[:space:]]*$//')"
          KEY="$(printf '%s' "$KEY" | tr -d '\r\n' | sed 's/^["[:space:]]*//;s/["[:space:]]*$//')"
          if [[ "$URL" == eyJ* && "$KEY" == https://* ]]; then
            TMP="$URL"
            URL="$KEY"
            KEY="$TMP"
          fi
          if [[ "$URL" =~ ^[a-z0-9]{20}$ ]]; then
            URL="https://${URL}.supabase.co"
          elif [[ "$URL" =~ ^[a-z0-9.-]+\.supabase\.co/?$ ]]; then
            URL="https://${URL%/}"
          fi
          echo "supabase url length=${#URL} key length=${#KEY}"
          if [[ "$URL" != https://* ]] || [[ ${#KEY} -lt 20 ]]; then
            echo "Missing or invalid Supabase secrets (need VITE_SUPABASE_* or PUBLIC_SUPABASE_*)" >&2
            exit 1
          fi
          {
            echo "PUBLIC_SUPABASE_URL=$URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$KEY"
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_ANON_KEY=$KEY"
          } >> "$GITHUB_ENV"
      - name: Build site
        run: npm run build
      - name: Build admin CRM
        working-directory: admin
        run: |
          npm ci
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env.production
          npm run build
      - name: Copy admin into site
        run: node scripts/copy-admin.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
