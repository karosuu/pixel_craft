<!doctype html>
<html lang="es">
	<head>
		<script>
			try {
				if (localStorage.getItem('pc-theme') === 'light') document.documentElement.classList.add('light');
			} catch (e) {}
			try {
				var redirect = sessionStorage.getItem('pc-admin-redirect');
				if (redirect) {
					sessionStorage.removeItem('pc-admin-redirect');
					if (redirect !== location.pathname + location.search + location.hash) {
						history.replaceState(null, '', redirect);
					}
				}
			} catch (e) {}
		</script>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Pixel-Craft · Admin</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
